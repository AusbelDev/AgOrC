# Copy to orchestrator.local.toml, or use `orchestrator init`.
# Provider names are yours to choose. Models listed here are suggestions;
# each role can use any model ID supported by its backend and account.
[providers.codex]
backend = "codex-cli"
# "login" = ChatGPT; "api" = API key cached by `codex login --with-api-key`.
# Configure the key in Codex, never in this file.
auth = "login"
executable = "codex"
models = ["gpt-6.1-sol"]

[providers.antigravity]
backend = "agy-cli"
auth = "login"
executable = "agy"
models = ["gemini-3.8-flash-medium"]
sandbox = false

[providers.claude]
backend = "claude-cli"
auth = "login"
executable = "claude"
# Native aliases, or enter a full model ID to pin a specific version.
models = ["sonnet", "opus", "haiku"]
sandbox = false

[roles.planner]
provider = "codex"
model = "gpt-6.1-sol"
reasoning = "high"
instructions = ""
skills = ["*"]
required_skills = []
# Enable existing CLI MCP connections for this role (e.g. to read Jira before planning).
use_mcp = false
# Claude only: extra tools approved without prompts. Use your actual server/tool names.
# Examples: ["mcp__jira__get_issue", "mcp__jira__search"] or ["mcp__jira__*"] for a whole server.
mcp_tools = []

[roles.worker]
provider = "antigravity"
model = "gemini-3.8-flash-medium"
reasoning = "medium"
instructions = ""
skills = ["*"]
# Add names of work skills that should apply every time, e.g. ["company-coding-rules"].
required_skills = []
use_mcp = false
mcp_tools = []

[roles.reviewer]
provider = "codex"
model = "gpt-6.1-sol"
reasoning = "high"
instructions = ""
skills = ["*"]
required_skills = []
use_mcp = false
mcp_tools = []

[skills]
# Discover each role's harness global skills automatically.
inherit_global = true
discover_project = true
# Optional extra folders (or a path to SKILL.md). Relative paths use the config directory.
paths = []

[workflow]
max_revision_rounds = 2
stage_timeout_seconds = 900
run_timeout_seconds = 3600
# Explicit argv arrays, executed in the task worktree without a shell.
# Set these for the target project, e.g. [["uv", "run", "pytest"]].
checks = []
